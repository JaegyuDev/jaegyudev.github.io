<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jaegyu.dev/anyflip</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Download an AnyFlip flipbook as a PDF, right in the browser." />
    <link rel="preload" href="/assets/fonts/JetBrainsMono-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="stylesheet" href="style.css" />
</head>

<body data-path="/anyflip">

    <div class="container">
        <div class="top">
            <h1 class="name">anyflip<span>.</span></h1>
            <p class="tagline">flipbook in, pdf out.<br>only for books you're allowed to download.</p>
        </div>

        <form class="tool" id="form">
            <label class="field"><span class="field-label">url</span>
                <input id="url" type="url" required spellcheck="false" placeholder="https://anyflip.com/abcd/efgh" /></label>
            <label class="field"><span class="field-label">title</span>
                <input id="title" type="text" spellcheck="false" placeholder="from book" /></label>
            <label class="field"><span class="field-label">threads</span>
                <input id="threads" type="number" min="1" max="16" value="6" /></label>
            <button id="go" type="submit">❯ download</button>
            <div class="bar"><div id="bar"></div></div>
            <pre class="log" id="log" aria-live="polite"></pre>
        </form>

        <div class="bottom">
            <div class="menu" id="menu"></div>
        </div>
    </div>

    <span class="location">west michigan</span>
    <script src="links.js"></script>
    <script src="nav.js"></script>
    <script src="vendor/pdf-lib.min.js"></script>
    <script src="anyflip.js"></script>
</body>

</html>
